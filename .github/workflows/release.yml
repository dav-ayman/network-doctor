name: release
on:
  push:
    tags: ["v*"]

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - run: python -m unittest discover -s tests -t .
      - name: build Claude Desktop extension
        run: python desktop/build.py
      - name: create release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          notes=$(awk '/^## /{n++} n==1' CHANGELOG.md | tail -n +2)
          gh release create "$GITHUB_REF_NAME" dist/*.mcpb docs/media/hero.mp4 \
            --title "network-doctor $GITHUB_REF_NAME" --notes "$notes"
