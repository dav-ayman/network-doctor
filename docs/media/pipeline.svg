<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1210 166" width="1210" height="166" role="img" aria-label="diagnosis pipeline: Wi-Fi, link, load, calls, MTU and DNS, router, report">
<style>
  rect{fill:rgba(127,127,127,.08);stroke:rgba(127,127,127,.45);stroke-width:1.5;animation:lit 5.7s ease-in-out infinite}
  .t{font:700 19px -apple-system,BlinkMacSystemFont,"Segoe UI",Helvetica,Arial,sans-serif;fill:#8b949e;text-anchor:middle;animation:txt 5.7s ease-in-out infinite}
  .u{font:400 12.5px -apple-system,BlinkMacSystemFont,"Segoe UI",Helvetica,Arial,sans-serif;fill:#8b949e;text-anchor:middle}
  .ar{fill:none;stroke:#8b949e;stroke-width:2}
  @keyframes lit{0%{fill:rgba(46,160,67,.08);stroke:rgba(127,127,127,.45)}6%,14%{fill:rgba(46,160,67,.28);stroke:#2ea043}30%,100%{fill:rgba(127,127,127,.08);stroke:rgba(127,127,127,.45)}}
  @keyframes txt{0%{fill:#8b949e}6%,14%{fill:#2ea043}30%,100%{fill:#8b949e}}
  .s0 rect,.s0 .t{animation-delay:0.0s}.s1 rect,.s1 .t{animation-delay:0.6s}.s2 rect,.s2 .t{animation-delay:1.2s}.s3 rect,.s3 .t{animation-delay:1.8s}.s4 rect,.s4 .t{animation-delay:2.4s}.s5 rect,.s5 .t{animation-delay:3.0s}.s6 rect,.s6 .t{animation-delay:3.6s}
  @media (prefers-reduced-motion: reduce){rect,.t{animation:none}}
</style>
<g class="st s0"><rect x="14" y="40" width="150" height="86" rx="12"/><text class="t" x="89.0" y="78">Wi-Fi</text><text class="u" x="89.0" y="102">signal, channel, neighbours</text></g><path class="ar" d="M167 83 l14 0 m-6 -5 l6 5 l-6 5"/><g class="st s1"><rect x="186" y="40" width="150" height="86" rx="12"/><text class="t" x="261.0" y="78">Link</text><text class="u" x="261.0" y="102">router ping, dropouts</text></g><path class="ar" d="M339 83 l14 0 m-6 -5 l6 5 l-6 5"/><g class="st s2"><rect x="358" y="40" width="150" height="86" rx="12"/><text class="t" x="433.0" y="78">Load</text><text class="u" x="433.0" y="102">lag while up/downloading</text></g><path class="ar" d="M511 83 l14 0 m-6 -5 l6 5 l-6 5"/><g class="st s3"><rect x="530" y="40" width="150" height="86" rx="12"/><text class="t" x="605.0" y="78">Calls</text><text class="u" x="605.0" y="102">UDP voice probe</text></g><path class="ar" d="M683 83 l14 0 m-6 -5 l6 5 l-6 5"/><g class="st s4"><rect x="702" y="40" width="150" height="86" rx="12"/><text class="t" x="777.0" y="78">MTU + DNS</text><text class="u" x="777.0" y="102">black holes, slow DNS</text></g><path class="ar" d="M855 83 l14 0 m-6 -5 l6 5 l-6 5"/><g class="st s5"><rect x="874" y="40" width="150" height="86" rx="12"/><text class="t" x="949.0" y="78">Router</text><text class="u" x="949.0" y="102">4G/5G, Wi-Fi, QoS</text></g><path class="ar" d="M1027 83 l14 0 m-6 -5 l6 5 l-6 5"/><g class="st s6"><rect x="1046" y="40" width="150" height="86" rx="12"/><text class="t" x="1121.0" y="78">Report</text><text class="u" x="1121.0" y="102">ranked fixes</text></g>
</svg>
