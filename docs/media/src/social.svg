<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 640" width="1280" height="640">
<style>.bar,.trace,.spike,.cursor{animation:none!important} .trace{stroke-dashoffset:0!important}
.l1{font:500 26px -apple-system,BlinkMacSystemFont,"Segoe UI",Helvetica,Arial,sans-serif;fill:#8b949e} .l2{font:500 22px -apple-system,BlinkMacSystemFont,"Segoe UI",Helvetica,Arial,sans-serif;fill:#6e7681}</style>
<rect width="1280" height="640" fill="#0d1117"/>
<g transform="translate(0,80)">
<style>
  .bg{fill:#0d1117} .grid{stroke:#21262d;stroke-width:1}
  .bar{fill:#3fb950;transform-origin:bottom;transform-box:fill-box;animation:grow 2.4s ease-in-out infinite}
  .b1{animation-delay:.15s} .b2{animation-delay:.3s} .b3{animation-delay:.45s}
  .trace{fill:none;stroke:#3fb950;stroke-width:4;stroke-linecap:round;stroke-linejoin:round;stroke-dasharray:1100;stroke-dashoffset:1100;animation:draw 4s ease-in-out infinite}
  .spike{fill:none;stroke:#f85149;stroke-width:4;stroke-linecap:round;stroke-linejoin:round;opacity:0;animation:flash 4s ease-in-out infinite}
  .title{font:700 76px ui-monospace,SFMono-Regular,Menlo,Consolas,monospace;fill:#e6edf3;letter-spacing:-1px}
  .tag{font:500 30px -apple-system,BlinkMacSystemFont,"Segoe UI",Helvetica,Arial,sans-serif;fill:#8b949e}
  .cursor{fill:#3fb950;animation:blink 1.1s steps(1) infinite}
  @keyframes grow{0%,100%{transform:scaleY(.35)}50%{transform:scaleY(1)}}
  @keyframes draw{0%{stroke-dashoffset:1100}55%,100%{stroke-dashoffset:0}}
  @keyframes flash{0%,30%{opacity:0}38%,48%{opacity:1}60%,100%{opacity:0}}
  @keyframes blink{50%{opacity:0}}
  @media (prefers-reduced-motion: reduce){.bar,.trace,.spike,.cursor{animation:none} .trace{stroke-dashoffset:0}}
</style>
<rect class="bg" width="1280" height="320" rx="18"/>
<g class="grid"><line x1="330" x2="1210" y1="152" y2="152"/><line x1="330" x2="1210" y1="192" y2="192"/><line x1="330" x2="1210" y1="232" y2="232"/></g>
<rect class="bar b0" x="70" y="194" width="24" height="36" rx="5"/><rect class="bar b1" x="104" y="166" width="24" height="64" rx="5"/><rect class="bar b2" x="138" y="138" width="24" height="92" rx="5"/><rect class="bar b3" x="172" y="110" width="24" height="120" rx="5"/>
<path class="trace" d="M330 232 L420 232 L436 224 L450 240 L464 232 L560 232 L574 190 L590 152 L606 210 L620 176 L640 232 L760 232 L772 224 L784 240 L796 232 L1210 232"/>
<path class="spike" d="M560 232 L574 190 L590 152 L606 210 L620 176 L640 232"/>
<text class="title" x="330" y="112">network-doctor<tspan class="cursor">_</tspan></text>
<text class="tag" x="330" y="290">Why is my internet bad? <tspan font-weight="700" fill="#3fb950">Ask Claude.</tspan></text>
</g>
<text class="l1" x="330" y="520">Wi-Fi · bufferbloat · call quality · MTU · DNS · 4G/5G signal</text>
<text class="l2" x="330" y="562">Huawei · ZTE · TP-Link · ASUS · FRITZ!Box · MikroTik · OpenWrt</text>
</svg>
